    <circle cx="24" cy="18" r="3.5" fill="url(#pawGrad)" />
    <circle cx="32" cy="18" r="3.5" fill="url(#pawGrad)" />
    <circle cx="39" cy="23" r="3.2" fill="url(#pawGrad)" />
    
